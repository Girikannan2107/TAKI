[project]
name = "taki-api"
version = "3.0.0"
description = "TAKI Travel backend: FastAPI on Cloud Run, Firestore, Firebase Auth, Cashfree, Google Maps"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
# Runtime dependencies are pinned in requirements.txt (Docker) and requirements-dev.txt (CI, local).
# This file holds project metadata and tool configuration only (P3 §4.5).
dependencies = []

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["app", "tests"]
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = [
    "B008",  # FastAPI dependencies are declared as call defaults (Depends(...))
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest works
    "S105",  # hard-coded test secrets
    "S106",
    "S311",  # non-crypto random in fixtures
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "emulator: needs the Firebase emulators (auth 9099, firestore 8080, storage 9199, project demo-taki)",
    "slow: long-running test (concurrency suites, large fixtures)",
]
filterwarnings = [
    "ignore::DeprecationWarning:google.*",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
exclude = ["^\\.venv/", "^tests/"]

[[tool.mypy.overrides]]
module = ["app.core.*"]
strict = true

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_empty = true
show_missing = true
