# Build the FastAPI image, push it to Artifact Registry and deploy Cloud Run service `taki-api`
# (asia-south1). Keyless auth with Workload Identity Federation. Runtime secrets live in Secret Manager.
#
# GitHub configuration (Settings > Environments > staging / production > Variables), see docs/v3/deploy.md:
#   GCP_PROJECT_ID, GCP_REGION (asia-south1), GCP_WIF_PROVIDER, GCP_DEPLOY_SA, GCP_RUNTIME_SA,
#   ARTIFACT_REPO (taki), APP_ORIGIN, PUBLIC_API_BASE_URL, CORS_ALLOWED_ORIGINS, FIREBASE_STORAGE_BUCKET,
#   CASHFREE_ENV (required: production for production, sandbox allowed only for staging), SWEEP_OIDC_AUDIENCE, SWEEP_INVOKER_EMAILS, MIN_INSTANCES
# No long-lived GitHub secrets are needed. Give the `production` environment a required reviewer.
name: deploy-backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  id-token: write # Workload Identity Federation

concurrency:
  group: deploy-backend-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy taki-api (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'staging' }}
    env:
      TARGET_ENV: ${{ inputs.environment || 'staging' }}
      PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION || 'asia-south1' }}
      SERVICE: taki-api
      CASHFREE_ENV: ${{ vars.CASHFREE_ENV }}
      IMAGE: ${{ vars.GCP_REGION || 'asia-south1' }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.ARTIFACT_REPO || 'taki' }}/api:${{ github.sha }}
    steps:
      # T3-4: CASHFREE_ENV has no default. Production must use Cashfree production keys; sandbox
      # "PAID" orders are not real money (the API also refuses to boot with that combination).
      - name: Validate CASHFREE_ENV
        run: |
          case "$CASHFREE_ENV" in
            production) ;;
            sandbox)
              if [ "$TARGET_ENV" = "production" ]; then
                echo "::error::CASHFREE_ENV=sandbox is not allowed for the production service" >&2; exit 1
              fi ;;
            *) echo "::error::Set the CASHFREE_ENV variable (production|sandbox) on the '$TARGET_ENV' environment" >&2
               exit 1 ;;
          esac

      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push image
        run: |
          docker build --pull -t "$IMAGE" backend
          docker push "$IMAGE"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}
          flags: >-
            --service-account=${{ vars.GCP_RUNTIME_SA }}
            --allow-unauthenticated
            --port=8080
            --cpu=1
            --memory=512Mi
            --concurrency=40
            --min-instances=${{ vars.MIN_INSTANCES || '0' }}
            --max-instances=10
            --timeout=60
            --cpu-boost
          env_vars: |
            APP_ENV=${{ env.TARGET_ENV }}
            LOG_JSON=true
            FIREBASE_PROJECT_ID=${{ vars.GCP_PROJECT_ID }}
            FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STORAGE_BUCKET }}
            APP_ORIGIN=${{ vars.APP_ORIGIN }}
            PUBLIC_API_BASE_URL=${{ vars.PUBLIC_API_BASE_URL }}
            CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}
            TRUST_PROXY_HEADERS=true
            PAYMENT_PROVIDER=cashfree
            CASHFREE_ENV=${{ env.CASHFREE_ENV }}
            CASHFREE_API_VERSION=2025-01-01
            MAPS_PROVIDER=google
            SWEEP_OIDC_AUDIENCE=${{ vars.SWEEP_OIDC_AUDIENCE }}
            SWEEP_INVOKER_EMAILS=${{ vars.SWEEP_INVOKER_EMAILS }}
          env_vars_update_strategy: overwrite
          secrets: |
            FILE_URL_SECRET=file-url-secret:latest
            PII_HASH_KEY=pii-hash-key:latest
            OTP_ENC_KEY=otp-enc-key:latest
            PASSWORD_PEPPER=password-pepper:latest
            CASHFREE_APP_ID=cashfree-app-id:latest
            CASHFREE_SECRET_KEY=cashfree-secret-key:latest
            GOOGLE_MAPS_SERVER_KEY=maps-server-key:latest
          secrets_update_strategy: overwrite

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "$URL/api/v1/health"; then echo; exit 0; fi
            sleep 6
          done
          echo "health check failed" >&2
          exit 1
