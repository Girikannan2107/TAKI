# Deploy Firestore rules + indexes and Storage rules from firebase/ (deny-all client rules; FastAPI uses
# the Admin SDK). Keyless auth with Workload Identity Federation (firebase-tools uses ADC).
name: deploy-firebase

on:
  push:
    branches: [main]
    paths:
      - "firebase/firestore.rules"
      - "firebase/firestore.indexes.json"
      - "firebase/storage.rules"
      - "firebase/firebase.json"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-firebase-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: rules + indexes (${{ inputs.environment || 'staging' }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
          create_credentials_file: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install firebase-tools
        run: npm install --global firebase-tools@15

      # `firebase deploy` compiles the rules server-side first and aborts on any error.
      - name: Deploy rules and indexes
        run: >
          firebase deploy
          --config firebase/firebase.json
          --only firestore:rules,firestore:indexes,storage
          --project "${{ vars.GCP_PROJECT_ID }}"
          --non-interactive
